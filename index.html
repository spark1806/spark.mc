<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARK — Minecraft Server</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== РОЗОВЫЕ ВСПЫШКИ ===== -->
    <div class="flash"></div>
    <div class="flash"></div>
    <div class="flash"></div>
    <div class="flash"></div>
    <div class="flash"></div>

    <!-- ===== ГЛАВНЫЙ ЭКРАН ===== -->
    <header class="hero">
        <h1 class="logo">SPARK</h1>
        <p class="subtitle">Приватный Minecraft сервер</p>
        <a href="#seasons" class="btn">Смотреть сезоны</a>
    </header>

    <!-- ===== СЕЗОНЫ ===== -->
    <section id="seasons">
        <h2>Сезоны</h2>
        <div class="cards">
            <!-- Сюда JS подгрузит карточки -->
        </div>
    </section>

    <!-- ===== ФУТЕР ===== -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>💾 Сейвы миров</h3>
                <p>Все сохранения сезонов SPARK</p>
                <p class="footer-note">Каждый сезон — это уникальный момент</p>
            </div>
            
            <div class="footer-section">
                <h3>🛒 Магазин</h3>
                <a href="https://shop.spark-mc.ru/" target="_blank" class="footer-link">
                    shop.spark-mc.ru
                </a>
                <p class="footer-note">Приобрети проходку на сервер</p>
            </div>
            
            <div class="footer-section">
                <h3>⚡ SPARK</h3>
                <p>Приватный Minecraft сервер</p>
                <p class="footer-note">2023 — 2026</p>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
